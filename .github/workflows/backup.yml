name: Backup Supabase

on:
  schedule:
    - cron: '30 4 * * *'   # diario, después del sync de YouTube (03:00 UTC)
  workflow_dispatch:        # para lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exportar tabla sessions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/sessions?select=*&order=created_at.asc" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -o /tmp/sessions.json
          count=$(jq length /tmp/sessions.json)
          echo "Partidas exportadas: $count"
          # Nunca sobrescribir un backup bueno con uno vacío.
          test "$count" -gt 0
          jq . /tmp/sessions.json > backups/sessions.json

      - name: Commit si hay cambios
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || (git commit -m "backup $(date -u +%F)" && git push)

      # En repos públicos GitHub desactiva los crons tras 60 días sin actividad.
      # Reactivar el workflow en cada ejecución evita que se apague solo.
      - name: Mantener el cron activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable"
